title: MIT Reveal.js Template
author: Joe Loffredo
version: 1.0.0
quarto-required: ">=1.4"
contributes:
  formats:
    revealjs:
      theme: [default, mit.scss]
      slide-number: true   # mit-nav.html supplies the number (n, or A-n)
      footer: "Joe Loffredo (MIT)"   # override with `footer:` in the doc YAML
      controls: true
      controls-layout: bottom-right
      controls-back-arrows: faded
      controls-tutorial: false
      menu:
        side: left
        numbers: true
      progress: true
      include-in-header: fonts.html
      include-after-body: mit-nav.html
      filters:
        - mit-filters.lua
      width: 100%
      height: 100%
      margin: 0.04
      center: false
      auto-stretch: false
      html-math-method: mathjax
      link-external-newwindow: true
      transition: none
      background-transition: none
    beamer:
      pdf-engine: xelatex
      navigation: empty
      slide-level: 2
      aspectratio: 169
      theme: metropolis
      # No progress rule under frame titles; a deck that wants it sets
      # themeoptions: [progressbar=frametitle, block=fill]
      themeoptions:
        - progressbar=none
        - block=fill
      # Top-align frame content; mit-filters.lua places lone images and button
      # rows on that assumption.
      classoption: t
      include-in-header: beamer-header.tex
      filters:
        - mit-filters.lua
